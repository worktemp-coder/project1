services:
  app:
    build:
      context: .
      target: production
    image: capstone-app:latest
    container_name: capstone-app
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - appnet

networks:
  appnet:
    driver: bridge