name: Capstone CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flask==3.0.3 werkzeug==3.0.3
      - name: Health check
        run: |
          APP_SECRET=test-secret python src/app.py &
          APP_PID=$!
          for i in {1..15}; do
            curl -s http://localhost:5000/health > /dev/null && break
            sleep 1
          done
          curl -s http://localhost:5000/health | grep -q "status"
          kill $APP_PID

  sast-bandit:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - name: Bandit scan
        run: |
          bandit -r src/ \
            --severity-level medium \
            --confidence-level medium \
            -f txt -o bandit-report.txt || BANDIT_EXIT=$?
          cat bandit-report.txt
          exit ${BANDIT_EXIT:-0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.txt

  container-scan:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t capstone-app:ci .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: capstone-app:ci
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

  iac-scan:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov
      - name: Checkov scan
        run: |
          checkov -d terraform/ \
            --framework terraform \
            --soft-fail --compact || true